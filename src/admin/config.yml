backend:  
  name: github
  repo: ulmeriano67-glitch/PARALOGIA
  branch: main
  site_domain: paralogia.netlify.app
site_url: https://paralogia.netlify.app
display_url: https://paralogia.netlify.app

media_folder: "src/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Publicaciones"
    label_singular: "Publicación"
    folder: "src/posts"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"

    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false

      - label: "Descripción corta"
        name: "description"
        widget: "text"

      - label: "Categoría"
        name: "category"
        widget: "string"
        required: false

      - label: "Imagen de portada"
        name: "image"
        widget: "image"
        required: false

      - label: "Texto alternativo de imagen"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Video de YouTube"
        name: "youtube_url"
        widget: "string"
        required: false
        hint: "Pega aquí el enlace completo del video de YouTube"
      - label: "Video MP4"
        name: "video_mp4"
        widget: "file"
        required: false
        hint: "Sube aquí un video MP4 para reproducirlo directamente en la publicación"
      - label: "Contenido"
        name: "body"
        widget: "markdown"

  - name: "games"
    label: "Juegos"
    label_singular: "Juego"
    folder: "src/games"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"

    fields:
      - label: "Nombre del juego"
        name: "title"
        widget: "string"

      - label: "Descripción"
        name: "description"
        widget: "text"

      - label: "Imagen de portada"
        name: "image"
        widget: "image"
        required: false

      - label: "Ruta o enlace del juego"
        name: "game_url"
        widget: "string"
        hint: "Ejemplo: /juegos/laberinto/"

      - label: "Instrucciones"
        name: "body"
        widget: "markdown"
        required: false

  - name: "pages"
    label: "Páginas del sitio"
    files:
      - label: "Información de PARALOGIA"
        name: "paginas"
        file: "src/_data/paginas.json"
        format: "json"

        fields:
          - label: "Sobre PARALOGIA"
            name: "sobre"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto principal", name: "texto1", widget: "text" }
              - { label: "Segundo texto", name: "texto2", widget: "text" }

          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Correo electrónico", name: "email", widget: "string" }

          - label: "Política de privacidad"
            name: "privacidad"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto principal", name: "texto1", widget: "text" }
              - { label: "Segundo texto", name: "texto2", widget: "text" }

          - label: "Términos y condiciones"
            name: "terminos"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto principal", name: "texto1", widget: "text" }
              - { label: "Segundo texto", name: "texto2", widget: "text" }
